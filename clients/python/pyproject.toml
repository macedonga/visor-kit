[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visor-kit"
version = "0.1.0"
description = "The Visor Development Kit from Python: Meta's glasses through Visor, over adb or the network."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = []
keywords = ["meta", "ray-ban", "smart-glasses", "neural-band", "wearables", "visor", "vdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://visor.macedonga.com/developers/"
Documentation = "https://visor.macedonga.com/developers/docs/"
Source = "https://github.com/macedonga/visor-kit"
Issues = "https://github.com/macedonga/visor-kit/issues"

[project.optional-dependencies]
network = ["websockets>=13"]
