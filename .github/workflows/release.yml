# Publishes a version tag (v1.2.3): the visor command to the GitHub release, the libraries to Maven Central, signed,
# and the TypeScript and Python clients to npm and PyPI at the same version. Maven Central is a job of its own, so
# the rest goes out even when Central refuses, and the job can be re-run alone from the workflow run.
# Run it by hand for a dry run: everything is built and checked, nothing is published.
#
# Secrets: MAVEN_CENTRAL_USERNAME and MAVEN_CENTRAL_PASSWORD (a Central Portal user token), SIGNING_KEY (the
# ASCII-armored private key) and SIGNING_KEY_PASSWORD; NPM_TOKEN, an npm granular token with "Read and write (stage
# only)": the workflow stages the npm version, and a maintainer releases it on npmjs.com with 2FA. PyPI takes no
# secret: it trusts this workflow as its trusted publisher (pypi.org > visor-kit > Publishing).
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ORG_GRADLE_PROJECT_vdkDocs: ${{ github.workspace }}/visor-site/src/content/docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The visor command bundles the docs, which live in the site repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: macedonga/visor-site
          path: visor-site

      - name: Work out the version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="0.0.0-dryrun"
          fi
          if ! [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "error: '$name' is not a version like 1.2.3 or 1.2.3-beta.1" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.0
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      # The tag is compared with the one before it, so check against that one, not against itself.
      - name: Check
        run: |
          git tag -d "$GITHUB_REF_NAME" 2>/dev/null || true
          ./gradlew check -PkitVersion="${{ steps.version.outputs.name }}"

      - name: Dry run
        if: github.event_name != 'push'
        run: ./gradlew publishToMavenLocal :cli:distZip -PkitVersion="${{ steps.version.outputs.name }}"

      - name: Build the visor command
        if: github.event_name == 'push'
        run: ./gradlew :cli:distZip -PkitVersion="${{ steps.version.outputs.name }}"

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          # The notes are the version's section of CHANGELOG.md.
          awk -v v="## $NAME" '$0 == v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "error: CHANGELOG.md has no section '## $NAME'" >&2
            exit 1
          fi
          flags=(--title "Visor Development Kit $NAME" --notes-file notes.md)
          if [[ "$NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "v$NAME" "tools/cli/build/distributions/visor-$NAME.zip" "${flags[@]}"

  maven:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ORG_GRADLE_PROJECT_vdkDocs: ${{ github.workspace }}/visor-site/src/content/docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: macedonga/visor-site
          path: visor-site

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.0
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for secret in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword ORG_GRADLE_PROJECT_signingInMemoryKey; do
            if [ -z "${!secret}" ]; then
              echo "error: a release secret is not set: $secret" >&2
              exit 1
            fi
          done
          ./gradlew publishToMavenCentral -PkitVersion="${GITHUB_REF_NAME#v}"

  clients:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # PyPI's trusted publishing.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Work out the version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "name=0.0.0-dryrun" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Both packages take the tag's version and the repo's license.
      - name: Build the clients
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          cp LICENSE clients/typescript/ && cp LICENSE clients/python/
          cd clients/typescript
          npm ci
          npm version "$NAME" --no-git-tag-version --allow-same-version
          npm run build
          npm pack --dry-run
          cd ../python
          sed -i "s/^version = .*/version = \"$NAME\"/" pyproject.toml
          python -m pip install --quiet build twine
          python -m build
          python -m twine check dist/*

      # Staged, not published: the version waits on npmjs.com until a maintainer approves it with 2FA. Staging needs
      # npm 11.15 or later.
      - name: Stage on npm
        if: github.event_name == 'push'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "error: a release secret is not set: NPM_TOKEN" >&2
            exit 1
          fi
          npm install --global npm@11
          cd clients/typescript
          npm stage publish

      - name: Publish to PyPI
        if: github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: clients/python/dist
